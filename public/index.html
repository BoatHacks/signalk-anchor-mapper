<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1118">
<title>Anchor Mapper</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; background: #0b1118; color: #d6e2ee; font: 14px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; z-index: 1000; top: 10px; right: 10px; width: 280px; max-height: 70%; overflow: auto;
           background: rgba(11, 17, 24, .92); border: 1px solid #2b3a4a; padding: 8px 10px; }
  #panel h1 { font-size: 13px; margin: 0 0 6px; letter-spacing: .08em; text-transform: uppercase; color: #8fb4d6; }
  .row { padding: 4px 0; border-top: 1px solid #1b2733; cursor: pointer; }
  .tag { display: inline-block; font-size: 11px; padding: 0 5px; margin-left: 4px; border: 1px solid #5b6b7b; color: #aab8c6; }
  .tag.buoy { border-color: #d9a441; color: #d9a441; }
  #status { color: #8a9bab; font-size: 12px; }
  #legend { margin-top: 8px; padding-top: 6px; border-top: 1px solid #2b3a4a; font-size: 12px; color: #aab8c6; }
  #legend summary { cursor: pointer; color: #8fb4d6; }
  #legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend svg { flex: none; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel"><h1>Anchored vessels</h1><div id="status">loading</div><div id="list"></div><details id="legend"><summary>Legend</summary>
<div><svg width="26" height="14"><circle cx="13" cy="7" r="6" fill="none" data-style="normal" stroke-width="2"/></svg>anchor and swing circle</div>
<div><svg width="26" height="14"><circle cx="13" cy="7" r="6" fill="none" data-style="normal" stroke-width="2" stroke-dasharray="0.5 4" stroke-linecap="round"/></svg>weak fit (noisy ring)</div>
<div><svg width="26" height="14"><ellipse cx="13" cy="7" rx="11" ry="5" fill="none" data-style="normal" stroke-width="2" stroke-dasharray="4 3"/></svg>area only, anchor not placed</div>
<div><svg width="26" height="14"><circle cx="13" cy="7" r="6" fill="none" data-style="moored" stroke-width="2"/></svg>possibly moored (tight swing)</div>
<div><svg width="26" height="14"><circle cx="13" cy="7" r="6" fill="none" data-style="buoy" stroke-width="2"/></svg>possible mooring buoy</div>
<div><svg width="26" height="14"><circle cx="13" cy="7" r="6" fill="none" stroke="#ff4f6d" stroke-width="2"/><circle cx="13" cy="7" r="2" fill="#ff4f6d"/></svg>own anchor and alarm radius</div>
</details></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="shapes.js"></script>
<script src="app.js"></script>
</body>
</html>
